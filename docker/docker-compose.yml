version: '3.8'

services:
  trns-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trns-bot
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - AUTH_KEY=${AUTH_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # TRNS_HOME tells the app where to find config.json, metadata.json, etc.
      # Must match the container-side mount path below.
      - TRNS_HOME=/app/config
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Place config.json, metadata.json, api_key.txt, etc. in ../config/
      - ../config:/app/config
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

